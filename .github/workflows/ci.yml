name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Prefer `npm ci` (reproducible); fall back to `npm install` when the
      # lockfile is absent or temporarily out of sync (e.g. just after a
      # dependency was added and before the lockfile workflow regenerates it).
      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # Emit JSON so the job summary can report exact test counts.
        run: npm test -- --reporter=dot --reporter=json --outputFile=vitest-report.json

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostos-dist
          path: dist
          if-no-files-found: error

      - name: Job summary (tests, build, wallpapers)
        if: always()
        run: |
          {
            echo "## GhostOS CI — build-and-test"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            if [ -f vitest-report.json ]; then
              node -e '
                try {
                  const r = require("./vitest-report.json");
                  const t = r.numTotalTests ?? 0, p = r.numPassedTests ?? 0, f = r.numFailedTests ?? 0;
                  const files = r.numTotalTestSuites ?? (r.testResults?.length ?? 0);
                  console.log(`- Unit/integration tests: **${p}/${t} passed**` + (f ? ` (${f} failed)` : "") + ` across ${files} files`);
                } catch (e) { console.log("- Unit tests: report unavailable"); }
              ' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Unit tests: no report produced"
            fi
            if [ -d dist ]; then
              echo "- Production build: **OK** ($(find dist -type f | wc -l) files)"
            else
              echo "- Production build: **missing dist/**"
            fi
            echo ""
            echo "### Wallpaper assets (raster)"
            for id in castle graveyard forest void; do
              src="src/assets/wallpapers/$id.webp"
              if [ -f "$src" ]; then
                bundled=$(find dist/assets -name "$id-*.webp" 2>/dev/null | head -1)
                if [ -n "$bundled" ]; then
                  echo "- \`$id.webp\`: source ✓, bundled ✓ ($(du -h "$bundled" | cut -f1))"
                else
                  echo "- \`$id.webp\`: source ✓, bundled ✗ (SVG fallback will render)"
                fi
              else
                echo "- \`$id\`: no raster (original SVG scene renders)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end browser tests
        run: npm run test:e2e

      - name: Job summary (e2e)
        if: always()
        run: |
          {
            echo "## GhostOS CI — e2e (Playwright / Chromium)"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
